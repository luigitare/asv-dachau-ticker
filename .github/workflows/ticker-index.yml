name: Ticker-Index Update

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ticker-index.yml"
  # Aktivieren, sobald der Testlauf durch ist:
  # schedule:
  #   - cron: "*/15 7-19 * * 6,0"   # Sa/So 8:50-20:00 MEZ

permissions:
  contents: write

concurrency:
  group: ticker-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Runner-IP loggen (Geo-Diagnose)
        run: echo "Runner-IP: $(curl -s --max-time 10 https://api.ipify.org)"

      - name: BVV-Ticker-Backend laden
        run: |
          set -o pipefail
          CODE=$(curl -sS --compressed --max-time 180 \
            -H "Origin: https://bvv.sams-ticker.de" \
            -H "Referer: https://bvv.sams-ticker.de/" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64)" \
            -o ticker-raw.json \
            -w "%{http_code}" \
            https://backend.sams-ticker.de/live/indoor/tickers/bvv) || CODE=FAIL
          echo "HTTP-Code: $CODE"
          echo "Groesse: $(stat -c %s ticker-raw.json 2>/dev/null || echo 0) Bytes"
          if [ "$CODE" != "200" ]; then
            echo "=== Fehler: Backend nicht erreichbar (HTTP $CODE) ==="
            head -c 500 ticker-raw.json 2>/dev/null || true
            exit 1
          fi

      - name: Index bauen (slimmen + validieren)
        run: |
          python3 - <<'PYEOF'
          import json, sys, os

          raw = json.load(open("ticker-raw.json", encoding="utf-8"))
          states = {}
          for s in (raw.get("matchStates") or {}).values():
              u = s.get("matchUuid")
              if u: states[u] = s

          days_out, used, total = [], set(), 0
          for day in raw.get("matchDays") or []:
              ms_out = []
              for m in day.get("matches") or []:
                  slim = {"id": m.get("id"),
                          "teamDescription1": m.get("teamDescription1"),
                          "teamDescription2": m.get("teamDescription2")}
                  if m.get("team1"): slim["t1i"] = m["team1"]
                  if m.get("team2"): slim["t2i"] = m["team2"]
                  slim["date"] = m.get("date")
                  slim["matchSeries"] = m.get("matchSeries")
                  st = states.get(m.get("id"))
                  if st:
                      slim["st"] = 1 if st.get("started") else 0
                      slim["fi"] = 1 if st.get("finished") else 0
                      sp = st.get("setPoints") or {}
                      slim["sp1"] = sp.get("team1") or 0
                      slim["sp2"] = sp.get("team2") or 0
                  ms_out.append(slim)
                  used.add(m.get("matchSeries"))
                  total += 1
              days_out.append({"matches": ms_out})

          if total < 200:
              print(f"ABBRUCH: nur {total} Matches (<200) - Backend-Fenster verdächtig duenn")
              sys.exit(1)

          ser = raw.get("matchSeries") or {}
          ligen = {u: {"n": ser[u].get("name"), "g": ser[u].get("gender"), "c": ser[u].get("class")}
                   for u in used if u in ser and ser[u].get("name")}
          idx = {"matchDays": days_out, "ligen": ligen}
          idx_str = json.dumps(idx, separators=(",", ":"), ensure_ascii=False)

          asv = {}
          for day in raw.get("matchDays") or []:
              for m in day.get("matches") or []:
                  t1 = m.get("teamDescription1") or ""
                  t2 = m.get("teamDescription2") or ""
                  if "ASV Dachau" in t1 or "ASV Dachau" in t2:
                      e = asv.setdefault(m.get("matchSeries"), {"spiele": 0, "asvTeams": [], "gegner": []})
                      e["spiele"] += 1
                      for name in (t1, t2):
                          if "ASV Dachau" in name and name not in e["asvTeams"]:
                              e["asvTeams"].append(name)
                          if name not in e["gegner"]:
                              e["gegner"].append(name)
          wliste = [{"wettbewerb": u, "liga": ser.get(u, {}).get("name"), "spiele": e["spiele"],
                     "asvTeams": e["asvTeams"], "gegnerBeispiele": e["gegner"][:4]}
                    for u, e in sorted(asv.items(), key=lambda kv: (ser.get(kv[0], {}).get("name") or ""))]
          wett = {"stand": "automatisch generiert (GitHub Action)", "wettbewerbe": wliste}
          wett_str = json.dumps(wett, indent=2, ensure_ascii=False)

          def write_if_changed(path, content):
              if os.path.exists(path) and open(path, encoding="utf-8").read() == content:
                  print(f"{path}: unverändert")
                  return False
              open(path, "w", encoding="utf-8").write(content)
              print(f"{path}: neu geschrieben")
              return True

          c1 = write_if_changed("ticker-index.json", idx_str)
          c2 = write_if_changed("asv-wettbewerbe.json", wett_str)
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write("changed=" + ("true" if (c1 or c2) else "false") + "\n")
          print(f"STATS: matches={total} ligen={len(ligen)} asvWettbewerbe={len(wliste)}")
          PYEOF

      - name: Commit (nur bei Aenderung)
        if: env.changed == 'true'  # wird ueber GITHUB_OUTPUT gesetzt; Fallback unten greift trotzdem
        run: |
          git config user.name "asv-ticker-bot"
          git config user.email "actions@github.com"
          git add ticker-index.json asv-wettbewerbe.json
          if git diff --cached --quiet; then echo "Keine Aenderungen"; exit 0; fi
          git commit -m "Ticker-Index aktualisieren [github-action]"
          git push
