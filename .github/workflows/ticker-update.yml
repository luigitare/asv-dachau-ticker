name: Ticker-Index Update

# DEAKTIVIERT (Standby): BVV-Backend blockt US-Runner-IPs mit 403 (Geo-Regel,
# verifiziert 03.11.2026 ueber ticker-probe.txt). Nur noch manuell startbar.
# Wenn BVV die Sperre aufhebt: push-Trigger und/oder schedule unten wieder einkommentieren.
on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - ".github/workflows/ticker-update.yml"
  #     - "scripts/ticker_update.py"
  # schedule:
  #   - cron: "*/15 7-19 * * 6,0"   # Sa/So 8:50-20:00 MEZ

permissions:
  contents: write

concurrency:
  group: ticker-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend laden (Probe-Modus)
        run: |
          set -o pipefail
          IP=$(curl -s --max-time 10 https://api.ipify.org)
          echo "Runner-IP: $IP"
          CODE=$(curl -sS --compressed --max-time 180 \
            -H "Origin: https://bvv.sams-ticker.de" \
            -H "Referer: https://bvv.sams-ticker.de/" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64)" \
            -o ticker-raw.json \
            -w "%{http_code}" \
            https://backend.sams-ticker.de/live/indoor/tickers/bvv) || CODE=FAIL
          echo "HTTP-Code: $CODE"
          echo "Groesse: $(stat -c %s ticker-raw.json 2>/dev/null || echo 0) Bytes"
          echo "code=$CODE" >> "$GITHUB_ENV"
          echo "runner_ip=$IP" >> "$GITHUB_ENV"

      - name: Probe-Datei committen
        run: |
          git config user.name "asv-ticker-bot"
          git config user.email "actions@github.com"
          printf 'Zeit: %s\nRunner-IP: %s\nHTTP-Code: %s\nGroesse: %s Bytes\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$runner_ip" "$code" \
            "$(stat -c %s ticker-raw.json 2>/dev/null || echo 0)" > ticker-probe.txt
          cat ticker-probe.txt
          git add ticker-probe.txt
          git diff --cached --quiet || (git commit -m "Ticker-Probe [github-action]" && git push)

      - name: Index bauen
        if: env.code == '200'
        run: python3 scripts/ticker_update.py

      - name: Index committen
        if: env.code == '200'
        run: |
          git config user.name "asv-ticker-bot"
          git config user.email "actions@github.com"
          git add ticker-index.json asv-wettbewerbe.json
          if git diff --cached --quiet; then echo "Keine Aenderungen"; exit 0; fi
          git commit -m "Ticker-Index aktualisieren [github-action]"
          git push
